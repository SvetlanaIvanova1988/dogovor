<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Договор поставки</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; }
    label { display: block; margin-top: 10px; }
    input { width: 100%; padding: 4px; }
    table { width: 100%; margin-top: 15px; border-collapse: collapse; }
    td, th { border: 1px solid #ccc; padding: 4px; }
  </style>
</head>
<body>
  <h2>Данные для счёт-договора</h2>
  <form method="post" action="/generate">
    <label>Номер договора <input name="contract_number" value="0805-3" required></label>
    <label>Дата <input name="contract_date" value="{{ today }}" required></label>
    <label>Город <input name="city" value="Москва"></label>

    <h3>Поставщик</h3>
    <label>Наименование (ИП) <input name="supplier_name" required></label>
    <label>ИНН <input name="supplier_inn" required></label>
    <label>ОГРНИП <input name="supplier_ogrnip"></label>
    <label>Адрес <input name="supplier_address"></label>
    <label>Банк <input name="supplier_bank"></label>
    <label>Расчётный счёт <input name="supplier_account"></label>

    <h3>Покупатель</h3>
    <label>Наименование <input name="buyer_name" required></label>
    <label>ИНН <input name="buyer_inn"></label>
    <label>Адрес <input name="buyer_address"></label>

    <h3>Товарные позиции</h3>
    <table id="items">
      <thead>
        <tr><th>Наименование</th><th>Ед.</th><th>Кол-во</th><th>Цена</th></tr>
      </thead>
      <tbody>
        <tr>
          <td><input name="item_name"></td>
          <td><input name="item_unit" value="шт."></td>
          <td><input name="item_qty" type="number" step="0.01"></td>
          <td><input name="item_price" type="number" step="0.01"></td>
        </tr>
      </tbody>
    </table>
    <button type="button" onclick="addRow()">Добавить строку</button>

    <h3>Оплата</h3>
    <label>Аванс, % <input name="advance_percent" value="50"></label>
    <label>Срок поставки, дней <input name="delivery_days"></label>

    <br><br>
    <button type="submit">Сформировать PDF</button>
  </form>

  <script>
    function addRow() {
      const tbody = document.querySelector('#items tbody');
      const row = tbody.rows[0].cloneNode(true);
      row.querySelectorAll('input').forEach(input => input.value = input.name === 'item_unit' ? 'шт.' : '');
      tbody.appendChild(row);
    }
  </script>
</body>
</html>
